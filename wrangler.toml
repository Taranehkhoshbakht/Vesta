# Cloudflare Workers + Static Assets — فروشگاه پوشاک وستا
# راهنما: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "vesta"
main = "cloudflare/worker.js"
compatibility_date = "2024-11-01"

# فرانت‌اند (فایل‌های استاتیک)
[assets]
directory = "./public"
binding = "ASSETS"

# دیتابیس KV — بعد از ساخت KV در Cloudflare، id را اینجا جایگزین کنید
# ساخت KV:  wrangler kv namespace create DB
# اگر id را اینجا نگذارید، از KV Binding که در داشبورد Cloudflare
# (Settings → Bindings) با نام DB اضافه کرده‌اید استفاده می‌شود.
# [[kv_namespaces]]
# binding = "DB"
# id = "your-kv-namespace-id"

[observability]
enabled = true
