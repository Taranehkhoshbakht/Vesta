<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بدون اتصال | پوشاک وستا</title>
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .off-box{max-width:380px}
  .off-ic{width:96px;height:96px;border-radius:28px;background:var(--c60);color:var(--c30);display:grid;place-items:center;font-size:44px;font-weight:900;margin:0 auto 20px;box-shadow:var(--shadow)}
  h1{font-size:22px;margin-bottom:8px}
  p{color:var(--muted);font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
  <div class="off-box">
    <div class="off-ic">V</div>
    <h1>اتصال اینترنت قطع است</h1>
    <p>برای مشاهده فروشگاه و ثبت سفارش، لطفاً اینترنت خود را وصل کنید. صفحه‌هایی که قبلاً دیده‌اید از حافظه در دسترس هستند.</p>
    <button class="btn btn-primary btn-lg" onclick="location.reload()">🔄 تلاش مجدد</button>
  </div>
</body>
</html>
